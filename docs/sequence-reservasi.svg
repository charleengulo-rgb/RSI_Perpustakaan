<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="878"><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#245d73"/></marker></defs><rect width="1100" height="878" fill="white"/><g font-family="Arial" fill="#183446"><text x="20" y="28" font-size="22" font-weight="bold">Ajukan Reservasi</text><rect x="1" y="45" width="208" height="42" rx="7" fill="#e5f0f3"/><text x="105" y="71" text-anchor="middle" font-size="13">Anggota</text><line x1="105" y1="87" x2="105" y2="858" stroke="#aabcc3" stroke-dasharray="5 5"/><rect x="276" y="45" width="208" height="42" rx="7" fill="#e5f0f3"/><text x="380" y="71" text-anchor="middle" font-size="13">HalamanReservasiController</text><line x1="380" y1="87" x2="380" y2="858" stroke="#aabcc3" stroke-dasharray="5 5"/><rect x="576" y="45" width="208" height="42" rx="7" fill="#e5f0f3"/><text x="680" y="71" text-anchor="middle" font-size="13">ReservasiService</text><line x1="680" y1="87" x2="680" y2="858" stroke="#aabcc3" stroke-dasharray="5 5"/><rect x="876" y="45" width="208" height="42" rx="7" fill="#e5f0f3"/><text x="980" y="71" text-anchor="middle" font-size="13">Entity / Repository</text><line x1="980" y1="87" x2="980" y2="858" stroke="#aabcc3" stroke-dasharray="5 5"/><text x="242.5" y="115" text-anchor="middle" font-size="13">R1: POST konfirmasi(idBuku)</text><line x1="105" y1="124" x2="380" y2="124" stroke="#245d73" marker-end="url(#a)"/><text x="530.0" y="167" text-anchor="middle" font-size="13">R2: ajukanReservasi(idAnggota, idBuku)</text><line x1="380" y1="176" x2="680" y2="176" stroke="#245d73" marker-end="url(#a)"/><text x="830.0" y="219" text-anchor="middle" font-size="13">R3: ambil anggota &amp; buku dengan lock</text><line x1="680" y1="228" x2="980" y2="228" stroke="#245d73" marker-end="url(#a)"/><rect x="20" y="258" width="1060" height="33" fill="#fff3e2" stroke="#c9ab7c"/><text x="32" y="280" font-size="14">break | Anggota/buku tidak ada: R10-R11 pesan; proses berhenti</text><text x="830.0" y="323" text-anchor="middle" font-size="13">R4: buku.cekStok()</text><line x1="680" y1="332" x2="980" y2="332" stroke="#245d73" marker-end="url(#a)"/><text x="830.0" y="375" text-anchor="middle" font-size="13">R5: hasil pemeriksaan stok</text><line x1="980" y1="384" x2="680" y2="384" stroke="#245d73" marker-end="url(#a)"/><rect x="20" y="414" width="1060" height="33" fill="#fff3e2" stroke="#c9ab7c"/><text x="32" y="436" font-size="14">break | Stok &gt; 0: R10-R11 arahkan untuk meminjam; tidak disimpan</text><text x="830.0" y="479" text-anchor="middle" font-size="13">R6: existsByAnggota...AndBuku...()</text><line x1="680" y1="488" x2="980" y2="488" stroke="#245d73" marker-end="url(#a)"/><text x="830.0" y="531" text-anchor="middle" font-size="13">R7: hasil pemeriksaan duplikat</text><line x1="980" y1="540" x2="680" y2="540" stroke="#245d73" marker-end="url(#a)"/><rect x="20" y="570" width="1060" height="33" fill="#fff3e2" stroke="#c9ab7c"/><text x="32" y="592" font-size="14">break | Sudah ada reservasi: R10-R11 pesan; tidak disimpan</text><text x="830.0" y="635" text-anchor="middle" font-size="13">R8: Reservasi.buat(anggota, buku)</text><line x1="680" y1="644" x2="980" y2="644" stroke="#245d73" marker-end="url(#a)"/><text x="830.0" y="687" text-anchor="middle" font-size="13">R9: reservasiRepository.save(r)</text><line x1="680" y1="696" x2="980" y2="696" stroke="#245d73" marker-end="url(#a)"/><text x="530.0" y="739" text-anchor="middle" font-size="13">R10: Bukti.dari(r); transaksi commit</text><line x1="680" y1="748" x2="380" y2="748" stroke="#245d73" marker-end="url(#a)"/><text x="242.5" y="791" text-anchor="middle" font-size="13">R11: redirect GET /reservasi; bukti</text><line x1="380" y1="800" x2="105" y2="800" stroke="#245d73" marker-end="url(#a)"/></g></svg>