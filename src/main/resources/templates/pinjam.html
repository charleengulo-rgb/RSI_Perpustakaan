<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perpustakaan RSI</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><header><div><small>LATIHAN IMPLEMENTASI RSI</small><h1>Perpustakaan</h1></div><form th:action="@{/logout}" method="post"><button>Keluar</button></form></header><nav><a th:href="@{/reservasi}">Reservasi saya</a></nav><h2>Pinjam buku</h2><p>Anggota: <b th:text="${idAnggota}"></b></p><p class="notice" role="status" th:if="${pesan}" th:text="${pesan}"></p><p th:if="${bisaReservasi}"><a class="button" th:href="@{/reservasi(idBuku=${idBukuGagal})}">Ajukan Reservasi</a></p><section class="success" th:if="${bukti}"><h2>Bukti transaksi</h2><dl><dt>Nomor</dt><dd th:text="${bukti.nomor}"></dd><dt>Anggota</dt><dd th:text="${bukti.anggota}"></dd><dt>Buku</dt><dd th:text="${bukti.buku}"></dd><dt>Tanggal</dt><dd th:text="${bukti.tanggal}"></dd><dt>Status</dt><dd th:text="${bukti.status}"></dd></dl></section><table><thead><tr><th>ID</th><th>Judul</th><th>Stok tersedia</th><th>Aksi</th></tr></thead><tbody><tr th:each="b:${daftarBuku}"><td th:text="${b.idBuku}"></td><td th:text="${b.judul}"></td><td th:text="${b.stok}"></td><td><form th:action="@{/pinjam}" method="post"><input type="hidden" name="idBuku" th:value="${b.idBuku}"><button>Pinjam</button></form></td></tr></tbody></table></main></body></html>
