<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perpustakaan RSI</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><header><div><small>LATIHAN IMPLEMENTASI RSI</small><h1>Perpustakaan</h1></div><form th:action="@{/logout}" method="post"><button>Keluar</button></form></header><h2>Kelola stok buku</h2><p>Masukkan jumlah eksemplar yang tersedia saat ini. Nilai ini menggantikan stok sebelumnya.</p><p class="notice" role="status" th:if="${pesan}" th:text="${pesan}"></p><table><thead><tr><th>ID</th><th>Judul</th><th>Stok tersedia</th><th>Perbarui stok</th></tr></thead><tbody><tr th:each="b:${daftarBuku}"><td th:text="${b.idBuku}"></td><td th:text="${b.judul}"></td><td th:text="${b.stok}"></td><td><form class="inline" th:action="@{/stok}" method="post"><input type="hidden" name="idBuku" th:value="${b.idBuku}"><label th:for="${'stok-'+b.idBuku}">Stok baru</label><input th:id="${'stok-'+b.idBuku}" type="number" name="stokBaru" min="0" max="2147483647" required th:value="${b.stok}"><button>Simpan</button></form></td></tr></tbody></table></main></body></html>
