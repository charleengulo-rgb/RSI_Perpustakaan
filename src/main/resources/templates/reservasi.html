<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perpustakaan RSI</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main><header><div><small>LATIHAN IMPLEMENTASI RSI</small><h1>Perpustakaan</h1></div><form th:action="@{/logout}" method="post"><button>Keluar</button></form></header><nav><a th:href="@{/pinjam}">Kembali ke peminjaman</a></nav><h2>Ajukan reservasi</h2><p class="notice" role="status" th:if="${pesan}" th:text="${pesan}"></p><section class="success" th:if="${bukti}"><h2>Bukti transaksi</h2><dl><dt>Nomor</dt><dd th:text="${bukti.nomor}"></dd><dt>Anggota</dt><dd th:text="${bukti.anggota}"></dd><dt>Buku</dt><dd th:text="${bukti.buku}"></dd><dt>Tanggal</dt><dd th:text="${bukti.tanggal}"></dd><dt>Status</dt><dd th:text="${bukti.status}"></dd></dl></section><section th:if="${buku}"><h3 th:text="${buku.judul}"></h3><p>Reservasi akan dicatat jika buku masih habis dan belum pernah Anda reservasi.</p><form th:action="@{/reservasi}" method="post"><input type="hidden" name="idBuku" th:value="${buku.idBuku}"><button>Konfirmasi reservasi</button></form></section><h2>Reservasi saya</h2><p th:if="${#lists.isEmpty(reservasi)}">Belum ada reservasi.</p><table th:unless="${#lists.isEmpty(reservasi)}"><thead><tr><th>Nomor</th><th>Buku</th><th>Tanggal</th><th>Status</th></tr></thead><tbody><tr th:each="r:${reservasi}"><td th:text="${r.nomor}"></td><td th:text="${r.buku}"></td><td th:text="${r.tanggal}"></td><td th:text="${r.status}"></td></tr></tbody></table></main></body></html>
